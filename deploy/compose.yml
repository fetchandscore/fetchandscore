# Runs the API behind a Cloudflare tunnel.
#
# No ports are published to the host and none need forwarding on the router:
# cloudflared dials out and Cloudflare routes api.fetchandscore.com back down
# that connection. Nothing on the home network is exposed.
#
# Copy .env.example to .env and fill it in before starting.

name: fetchandscore

services:
  api:
    image: ghcr.io/fetchandscore/api:${FNS_IMAGE_TAG:-latest}
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      FNS_DB_PATH: /data/fetchandscore.db
      FNS_ADDR: 0.0.0.0:8080
      FNS_BASE_URL: ${FNS_BASE_URL:-https://fetchandscore.com}
      FNS_ALLOWED_ORIGIN: ${FNS_ALLOWED_ORIGIN:-https://fetchandscore.com}
      FNS_SECURE_COOKIES: "true"
      FNS_MAILGUN_DOMAIN: ${FNS_MAILGUN_DOMAIN}
      FNS_MAILGUN_API_KEY: ${FNS_MAILGUN_API_KEY}
      FNS_MAIL_FROM: ${FNS_MAIL_FROM:-Fetch and Score <no-reply@fetchandscore.com>}
    volumes:
      - ./data:/data
    healthcheck:
      # The distroless image has no shell and no curl, so the check runs the
      # app's own binary. Nothing else in there can make an HTTP request.
      test: ["CMD", "/usr/local/bin/fnsctl", "migrate", "-db", "/data/fetchandscore.db"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Snapshots the database on a schedule.
  #
  # VACUUM INTO rather than copying the file: SQLite in WAL mode is mid-write
  # more often than you would think, and a copied file can be torn. This
  # produces a consistent snapshot without stopping the service.
  backup:
    image: alpine:3.21
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          sqlite3 /data/fetchandscore.db "VACUUM INTO '/backups/fns-$$stamp.db'" \
            && echo "backed up to fns-$$stamp.db" \
            || echo "backup failed"
          # Keep a fortnight of daily snapshots.
          ls -1t /backups/fns-*.db 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done
    security_opt:
      - no-new-privileges:true
