name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Formatting
        working-directory: api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: api
        run: go vet ./...

      # Installed rather than pulled as a prebuilt binary: the released
      # binaries are compiled against an older Go than this module targets,
      # and golangci-lint refuses to analyse a newer language version than it
      # was built with. Building it here guarantees they match.
      - name: Lint
        working-directory: api
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m

      # The frontend's point table is generated from the rules engine. If a
      # rule changed without regenerating, the screen would show a number the
      # server disagrees with — silently. This makes that a build failure.
      - name: Generated files are current
        run: |
          cd api && go generate ./...
          cd ..
          if ! git diff --exit-code -- web/js/scoring-table.js; then
            echo "::error::web/js/scoring-table.js is stale. Run: make generate"
            exit 1
          fi

      - name: Test
        working-directory: api
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: api/coverage.out

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Known vulnerabilities
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static security analysis
        uses: securego/gosec@master
        with:
          args: -exclude-generated -no-fail -fmt sarif -out gosec.sarif ./api/...

      - name: Dependency and filesystem CVEs
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Semgrep
        run: |
          pipx install semgrep
          semgrep --config auto --error --quiet api/ web/js/

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint and format
        run: npx --yes @biomejs/biome ci web/js e2e

      - name: Test
        working-directory: web
        run: node --test 'js/*.test.js'

      - name: Stylesheet builds
        run: |
          curl -sfL -o tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x tailwindcss
          ./tailwindcss -i web/css/app.css -o web/css/app.build.css --minify

      - name: Markup is valid
        run: npx --yes html-validate --config .htmlvalidate.json 'web/*.html'

  duplication:
    name: Duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Copy-paste detection
        run: |
          npx --yes jscpd --min-lines 12 --threshold 3 \
            --reporters console \
            --pattern "{api,web,e2e}/**/*.{go,js}" \
            --ignore "**/*.test.js,**/node_modules/**,**/scoring-table.js" .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: make build

      - name: Install browsers
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [go]
    # Skipped when the token is absent: on a fork's pull request, which has no
    # access to secrets, and before the SonarCloud project exists. A missing
    # token is a setup gap, not a code defect, and should not paint CI red.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar wants full history to attribute issues to the commit that
          # introduced them.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: api

      - uses: SonarSource/sonarqube-scan-action@v4
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
